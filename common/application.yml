spring:
  cloud:
    loadbalancer:
      ribbon:
        enabled: false

    openfeign:
      circuitbreaker:
        enabled: true

    circuitbreaker:
      resilience4j:
        enabled: true
        configs:
          default: # 공통 설정
            slidingWindowType: COUNT_BASED  # COUNT_BASED → 최근 N번 호출 / TIME_BASED → 최근 N초 동안
            slidingWindowSize: 100  # 실패율 계산할 최근 호출 수
            minimumNumberOfCalls: 10  # 실패율 계산하기 위한 최소 호출 수
            permittedNumberOfCallsInHalfOpenState: 10  # HALF-OPEN 상태에서 허용되는 호출 수
            failureRateThreshold: 50  # 실패율이 50%를 초과하면 OPEN (% 기준)
            waitDurationInOpenState: 30s  # OPEN 상태 유지 시간
            recordExceptions: # 실패로 간주할 예외 목록
              - java.lang.RuntimeException
              - org.springframework.web.client.HttpServerErrorException
  feign:
    client:
      default: # 공통 설정
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full # none, basic, headers, full

# Resilience4j 개별 모듈 설정 (Retry, Bulkhead, RateLimiter)
resilience4j:
  retry: # 재시도 설정
    configs:
      default: # 기본 재시도 설정
        maxAttempts: 3  # 최대 3회 재시도
        waitDuration: 1s  # 재시도 간 1초 대기
        enableExponentialBackoff: true  # 지수 백오프 활성화 (재시도마다 대기 시간 증가)
        exponentialBackoffMultiplier: 2.0  # 각 재시도마다 대기 시간이 2배로 증가
        retryExceptions: # 재시도할 예외 목록
          - java.lang.RuntimeException

  bulkhead: # 동시 요청수 제한
    configs:
      default: # 기본 벌크헤드 설정
        type: THREADPOOL  # 스레드풀 타입 벌크헤드 사용 (SEMAPHORE 대신)
        coreThreadPoolSize: 5  # 스레드풀의 기본 스레드 수 (항상 활성 상태로 유지)
        maxThreadPoolSize: 10  # 스레드풀의 최대 스레드 수 (부하 증가 시 확장)
        queueCapacity: 50  # 모든 스레드가 사용 중일 때 대기할 수 있는 요청 수

  ratelimiter: # 속도 제한 설정
    configs:
      default: # 기본 속도 제한 설정
        limitForPeriod: 50  # 주기당 최대 50개 요청 허용
        limitRefreshPeriod: 1s  # 제한이 1초마다 초기화됨
        timeoutDuration: 0ms  # 허가 대기 시간 (0ms는 대기 없이 즉시 거부)

# OPEN DOC API 설정
springdoc:
  version: '1.0.0'
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: alpha    # 알파벳순으로 정렬 기준
    tags-sorter: alpha          # 알파벳순으로 정렬 기준
    path: /api-docs.html
    disable-swagger-default-url: true
    display-request-duration: true   # 요청 소요 시간 표시
    doc-expansion: full
  paths-to-match:
    - /api/**

management:
  endpoints:
    web:
      exposure:
        include: refresh,health,info,metrics

logging:
  level:
    feign: DEBUG